name: Apply and build QuickGrade v1.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-ios-update.yml'
      - '.github/workflows/quickgrade-v1.4.bundle'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified QuickGrade v1.4 update
        run: |
          git fetch .github/workflows/quickgrade-v1.4.bundle refs/heads/main:refs/heads/quickgrade-v1.4-source
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git cherry-pick 8c0ccabcad502d5d6afbbb39b83ac8defce951e7

      - name: Verify permanent two-file update package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile

          root = pathlib.Path('.')
          package = root / 'QuickGrade_Update.zip'
          manifest = json.loads((root / 'update-manifest.json').read_text(encoding='utf-8'))
          payload = package.read_bytes()
          assert manifest['version'] == '1.4.0'
          assert manifest['size'] == len(payload)
          assert manifest['sha256'] == hashlib.sha256(payload).hexdigest()
          with zipfile.ZipFile(package) as archive:
              assert archive.namelist() == ['index.html']
              info = archive.getinfo('index.html')
              assert info.compress_type == zipfile.ZIP_STORED
              html = archive.read('index.html')
          assert html == (root / 'app/src/main/assets/index.html').read_bytes()
          assert html == (root / 'ios/QuickGradeIOS/index.html').read_bytes()
          print('QuickGrade v1.4 package verified')
          PY

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ios/QuickGradeIOS.xcodeproj \
            -scheme QuickGradeIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/QuickGrade.app build/Payload/
          cd build
          zip -qry QuickGrade-personal-unsigned.ipa Payload

      - name: Upload personal iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuickGrade-v1.4-personal-unsigned-ipa
          path: build/QuickGrade-personal-unsigned.ipa
          if-no-files-found: error

      - name: Publish working source
        run: |
          git rm .github/workflows/quickgrade-v1.4.bundle .github/workflows/apply-ios-update.yml
          git commit -m "Remove temporary v1.4 publishing files"
          git push origin HEAD:main
