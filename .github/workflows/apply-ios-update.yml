name: Apply and build QuickGrade iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-ios-update.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared iOS commits
        env:
          QUICKGRADE_BUNDLE_B64: 
        run: |
          printf '%s' "$QUICKGRADE_BUNDLE_B64" | base64 --decode > /tmp/quickgrade-ios.bundle
          git fetch /tmp/quickgrade-ios.bundle HEAD:refs/heads/quickgrade-ios-source
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git cherry-pick 9f6f12b 4f4ce7b
          git rm .github/workflows/build-ios.yml
          git commit -m "Use one-time personal iOS build"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ios/QuickGradeIOS.xcodeproj \
            -scheme QuickGradeIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/QuickGrade.app build/Payload/
          cd build
          zip -qry QuickGrade-personal-unsigned.ipa Payload

      - name: Upload personal iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuickGrade-personal-unsigned-ipa
          path: build/QuickGrade-personal-unsigned.ipa
          if-no-files-found: error

      - name: Publish working iOS source
        run: |
          git push origin HEAD:main
